<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Formulário</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f6; --card:#ffffff; --text:#111827; --muted:#6b7280; --line:#e5e7eb;
  --brand:#16a34a; --brand-dark:#15803d; --brand-soft:#dcfce7; --input:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0f0d; --card:#151a18; --text:#f3f4f6; --muted:#9ca3af; --line:#26302c;
    --brand-soft:#12301f; --input:#0f1412; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0f0d; --card:#151a18; --text:#f3f4f6; --muted:#9ca3af; --line:#26302c;
  --brand-soft:#12301f; --input:#0f1412; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:32px 16px 56px}
.head{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:12px;padding:24px;margin-bottom:16px}
.head h1{margin:0 0 6px;font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
.head p{margin:0;color:var(--muted);font-size:.95rem}
.block{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 24px;margin-bottom:12px;transition:border-color .15s,box-shadow .15s}
.block:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.block label{display:block;font-weight:600;font-size:1rem;margin-bottom:10px}
.block input,.block textarea{width:100%;font:inherit;font-size:1rem;color:var(--text);background:var(--input);border:1px solid var(--line);border-radius:8px;padding:12px 14px;outline:none;resize:vertical}
.block textarea{min-height:96px}
.block input::placeholder,.block textarea::placeholder{color:var(--muted)}
.block input:focus,.block textarea:focus{border-color:var(--brand)}
.block.erro{border-color:#dc2626}
.msg-erro{display:none;color:#dc2626;font-size:.85rem;margin-top:6px}
.block.erro .msg-erro{display:block}
button.enviar{width:100%;margin-top:8px;padding:16px;font:inherit;font-size:1.05rem;font-weight:600;color:#fff;background:var(--brand);border:0;border-radius:10px;cursor:pointer;transition:background .15s}
button.enviar:hover{background:var(--brand-dark)}
button.enviar:focus-visible{outline:3px solid var(--brand-soft);outline-offset:2px}
.final{display:none;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:12px;padding:40px 24px;text-align:center}
.final .check{width:56px;height:56px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 16px}
.final h2{margin:0 0 8px;font-size:1.35rem}
.final p{margin:0;color:var(--muted)}
.seguro{text-align:center;color:var(--muted);font-size:.8rem;margin-top:16px}
</style>
</head>
<body>
<main class="wrap">
  <section class="head">
    <h1 id="titulo"></h1>
    <p id="subtitulo"></p>
  </section>

  <form id="form" novalidate>
    <div id="blocos"></div>
    <button type="submit" class="enviar" id="btn"></button>
    <div class="seguro" id="rodape"></div>
  </form>

  <section class="final" id="final" role="status" aria-live="polite">
    <div class="check">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h2 id="final-titulo"></h2>
    <p id="final-texto"></p>
  </section>
</main>

<script>window.__CONFIG__ = /*CONFIG*/null;</script>
<script>
const C = window.__CONFIG__;
const TITULO=C.TITULO, SUBTITULO=C.SUBTITULO, TEXTO_BOTAO=C.TEXTO_BOTAO, RODAPE=C.RODAPE;
const MENSAGEM_FINAL_TITULO=C.MENSAGEM_FINAL_TITULO, MENSAGEM_FINAL_TEXTO=C.MENSAGEM_FINAL_TEXTO, MENSAGEM_ERRO=C.MENSAGEM_ERRO;
const BLOCOS = C.BLOCOS;

document.title = TITULO;
document.getElementById('titulo').textContent = TITULO;
document.getElementById('subtitulo').textContent = SUBTITULO;
document.getElementById('btn').textContent = TEXTO_BOTAO;
document.getElementById('rodape').textContent = RODAPE;
document.getElementById('final-titulo').textContent = MENSAGEM_FINAL_TITULO;
document.getElementById('final-texto').textContent = MENSAGEM_FINAL_TEXTO;

const container = document.getElementById('blocos');
BLOCOS.forEach((b, i) => {
  const id = 'campo' + (i + 1);
  const div = document.createElement('div');
  div.className = 'block';
  const label = document.createElement('label');
  label.htmlFor = id;
  label.textContent = b.pergunta;
  const campo = document.createElement(b.tipo === 'longo' ? 'textarea' : 'input');
  campo.id = id;
  campo.name = id;
  campo.placeholder = b.dica;
  if (b.tipo !== 'longo') campo.type = 'text';
  const erro = document.createElement('div');
  erro.className = 'msg-erro';
  erro.textContent = MENSAGEM_ERRO;
  campo.addEventListener('input', () => div.classList.remove('erro'));
  div.append(label, campo, erro);
  container.appendChild(div);
});

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  let primeiroErro = null;
  container.querySelectorAll('.block').forEach(div => {
    const campo = div.querySelector('input,textarea');
    if (!campo.value.trim()) {
      div.classList.add('erro');
      if (!primeiroErro) primeiroErro = campo;
    }
  });
  if (primeiroErro) { primeiroErro.focus(); return; }
  const dados = {};
  BLOCOS.forEach((b, i) => { dados[b.pergunta] = document.getElementById('campo' + (i + 1)).value.trim(); });
  fetch('/enviar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dados) }).catch(() => {});
  document.getElementById('form').style.display = 'none';
  const final = document.getElementById('final');
  final.style.display = 'block';
  final.scrollIntoView({ behavior: 'smooth', block: 'center' });
});
</script>
</body>
</html>
